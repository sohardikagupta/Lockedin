<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LockedIn</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--paper:#f6f8fc;--card:#fff;--line:#dbe2ef;--accent:#3b5bdb;--done:#2f9e6e;--mute:#6b7690}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf7;--paper:#141a2b;--card:#1d2540;--line:#2c3556;--accent:#7c93f5;--done:#4fc08d;--mute:#9aa5c4}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.9rem;font-weight:800;margin:8px 0 2px}
h2{font-size:1.05rem;font-weight:600;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.nav .date{flex:1;text-align:center;font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.add{display:flex;gap:8px;margin-bottom:12px}
.add input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li input{width:20px;height:20px;accent-color:var(--done);flex:none}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:var(--mute)}
li button{padding:4px 9px;color:var(--mute)}
.empty{color:var(--mute);padding:6px 0}
.stats{display:flex;gap:12px;margin-bottom:16px}
.stats div{flex:1}
.big{font-size:1.6rem;font-weight:800}
svg{width:100%;height:auto;display:block}
.note{color:var(--mute);font-size:.85rem;margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>LockedIn</h1>
  <p class="sub">Plan your day, tick it off, and watch your streak grow.</p>

  <div class="nav">
    <button id="prev" aria-label="Previous day">&lt;</button>
    <div class="date" id="dateLabel"></div>
    <button id="next" aria-label="Next day">&gt;</button>
    <button id="today">Today</button>
  </div>

  <div class="card">
    <div class="add">
      <input id="newTask" type="text" placeholder="Add a task, e.g. Physics chapter 4" maxlength="120">
      <button class="primary" id="addBtn">Add</button>
    </div>
    <ul id="list"></ul>
    <div class="bar"><i id="fill"></i></div>
    <div class="note" id="progressText"></div>
  </div>

  <div class="stats">
    <div class="card"><div class="big" id="streak">0</div>day streak</div>
    <div class="card"><div class="big" id="weekAvg">0%</div>last 7 days</div>
  </div>

  <div class="card">
    <h2>Last 14 days</h2>
    <svg id="chart" viewBox="0 0 320 150" role="img" aria-label="Bar chart of tasks completed per day"></svg>
    <div class="note">Each bar is the share of that day's tasks you finished.</div>
  </div>
</main>

<script>
const KEY = 'studentTracker.v1';
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

const pad = n => String(n).padStart(2, '0');
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
let current = new Date(); current.setHours(12, 0, 0, 0);
const $ = id => document.getElementById(id);

function stats(k) {
  const t = data[k] || [];
  const done = t.filter(x => x.d).length;
  return { total: t.length, done, pct: t.length ? done / t.length : 0 };
}
function daysAgo(n) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - n); return d; }

function render() {
  const k = keyOf(current);
  const tasks = data[k] || [];
  $('dateLabel').textContent = current.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });

  const list = $('list'); list.innerHTML = '';
  if (!tasks.length) {
    const p = document.createElement('div'); p.className = 'empty';
    p.textContent = 'No tasks yet. Add your first one above.'; list.appendChild(p);
  }
  tasks.forEach((t, i) => {
    const li = document.createElement('li'); if (t.d) li.className = 'done';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = t.d;
    cb.onchange = () => { t.d = cb.checked; save(); render(); };
    const sp = document.createElement('span'); sp.textContent = t.t;
    const del = document.createElement('button'); del.textContent = 'Delete'; del.setAttribute('aria-label', 'Delete ' + t.t);
    del.onclick = () => { tasks.splice(i, 1); save(); render(); };
    li.append(cb, sp, del); list.appendChild(li);
  });

  const s = stats(k);
  $('fill').style.width = Math.round(s.pct * 100) + '%';
  $('progressText').textContent = s.total ? s.done + ' of ' + s.total + ' done' : '';

  // streak: consecutive days (ending today, or yesterday if today is empty) with at least one task done
  let streak = 0, n = stats(keyOf(daysAgo(0))).done ? 0 : 1;
  while (stats(keyOf(daysAgo(n))).done) { streak++; n++; }
  $('streak').textContent = streak;

  let sum = 0, cnt = 0;
  for (let i = 0; i < 7; i++) { const x = stats(keyOf(daysAgo(i))); if (x.total) { sum += x.pct; cnt++; } }
  $('weekAvg').textContent = cnt ? Math.round(sum / cnt * 100) + '%' : '0%';

  drawChart();
}

function drawChart() {
  const svg = $('chart'); const W = 320, H = 150, base = 120, top = 10, bw = 16, gap = (W - 14 * bw) / 15;
  const css = getComputedStyle(document.documentElement);
  const line = css.getPropertyValue('--line'), done = css.getPropertyValue('--done'), mute = css.getPropertyValue('--mute');
  let out = `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="${line}"/>`;
  for (let i = 0; i < 14; i++) {
    const d = daysAgo(13 - i), s = stats(keyOf(d));
    const x = gap + i * (bw + gap), h = s.total ? Math.max(3, s.pct * (base - top)) : 3;
    out += `<rect x="${x}" y="${base - h}" width="${bw}" height="${h}" rx="3" fill="${s.total ? done : line}"/>`;
    out += `<text x="${x + bw / 2}" y="140" font-size="9" text-anchor="middle" fill="${mute}">${d.getDate()}</text>`;
  }
  svg.innerHTML = out;
}

function addTask() {
  const v = $('newTask').value.trim(); if (!v) return;
  const k = keyOf(current); (data[k] = data[k] || []).push({ t: v, d: false });
  $('newTask').value = ''; save(); render();
}
$('addBtn').onclick = addTask;
$('newTask').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
$('prev').onclick = () => { current.setDate(current.getDate() - 1); render(); };
$('next').onclick = () => { current.setDate(current.getDate() + 1); render(); };
$('today').onclick = () => { current = new Date(); current.setHours(12, 0, 0, 0); render(); };
render();
</script>
</body>
</html>
